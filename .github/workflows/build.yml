# Builds every board and runs the unit tests on each push and pull request.
# Pushing a tag like v1.2.0 also publishes a GitHub Release with each board's
# firmware.bin attached, ready to upload from the portal's System tab. The tag
# must match FW_VERSION in platformio.ini.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare_s3_matrix, huidu_hd_wf4, matrixportal_s3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - name: Name the image after the board and version
        run: |
          version=$(sed -n 's/.*FW_VERSION=\\"\([^\\]*\)\\".*/\1/p' platformio.ini)
          mkdir dist
          cp .pio/build/${{ matrix.env }}/firmware.bin dist/headup-${{ matrix.env }}-$version.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: dist/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches FW_VERSION and get its changelog notes
        run: |
          version=$(sed -n 's/.*FW_VERSION=\\"\([^\\]*\)\\".*/\1/p' platformio.ini)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match FW_VERSION $version in platformio.ini"
            exit 1
          fi
          # The CHANGELOG.md section for this version, without its heading.
          awk -v v="$version" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.bin
            THIRD_PARTY_NOTICES.md
