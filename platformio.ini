; Head-Up Display: HUB75 LED panel fed by a Yacht Devices Wi-Fi gateway
; (YDWG-02 / YDNR-02 / YDWN-02).
;
; Three controller boards are supported. They need different flash layouts, so
; each has its own environment and firmware image:
;
;   pio run -e waveshare_s3_matrix -t upload   Waveshare ESP32-S3-RGB-Matrix (default)
;   pio run -e huidu_hd_wf4 -t upload          Huidu HD-WF4 (see docs/flashing-hd-wf4.md)
;   pio run -e matrixportal_s3 -t upload       Adafruit Matrix Portal S3

[platformio]
default_envs = waveshare_s3_matrix

[env]
; pioarduino build of Arduino-ESP32 3.3.7 (the version Waveshare's examples target).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
;build_type = debug
extra_scripts =
  pre:scripts/embed_web.py
  pre:scripts/upload_mode.py
; How `-t upload` sends the firmware: usb, or ota (over Wi-Fi through the
; display's portal, to custom_ota_host). Either way, `-t ota` uploads over
; Wi-Fi and `--upload-port headup.local` (or an IP) switches one upload to it.
; Set these per board under its [env:...] section if your displays differ.
custom_upload = usb
custom_ota_host = headup.local
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"1.1.0\"
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
  adafruit/Adafruit GFX Library@^1.12.1
  adafruit/Adafruit BusIO@^1.17.0
  bblanchon/ArduinoJson@^7.4.2

[env:waveshare_s3_matrix]
; ESP32-S3-WROOM-2-N32R16V: 32 MB octal flash + 16 MB octal PSRAM.
board = esp32-s3-devkitc-1-n32r8v
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_build.partitions = partitions.csv
build_flags =
  ${env.build_flags}
  -DBOARD_WAVESHARE_S3_MATRIX

[env:huidu_hd_wf4]
; Bare ESP32-S3 (no PSRAM) + 8 MB cFeon QH64A SPI flash, which needs DIO mode.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HUIDU_HD_WF4

[env:matrixportal_s3]
; Adafruit Matrix Portal S3 (5778): 8 MB quad flash + 2 MB quad PSRAM.
; Based on the generic S3 board rather than adafruit_matrixportal_esp32s3,
; which also flashes a TinyUF2 bootloader into what is our second OTA slot.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DBOARD_ADAFRUIT_MATRIXPORTAL_S3

; Host-side unit tests for the protocol parsers: `pio test -e native`
[env:native]
platform = native
framework =
extra_scripts =
lib_deps =
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
